# Optional local hooks, see CONTRIBUTING.md → "Secret scanning".
#   pipx install pre-commit   # or: uv tool install pre-commit
#   pre-commit install
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      # Builds gitleaks with Go. No Go? Use `gitleaks-docker` (needs Docker)
      # or `gitleaks-system` (needs gitleaks on your PATH) instead.
      - id: gitleaks
